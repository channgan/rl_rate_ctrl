[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "px4-gazebo-rate-rl"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "gymnasium>=1.0,<1.3", "stable-baselines3>=2.6,<3", "tensorboard>=2.16", "PyYAML>=6", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["rate_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
